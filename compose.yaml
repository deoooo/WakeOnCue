services:
  api:
    build: .
    command: ["pnpm", "start:api"]
    env_file: [.env]
    environment:
      WAKEONCUE_HOST: 0.0.0.0
      WAKEONCUE_DATABASE_PATH: /data/wakeoncue.sqlite
    ports: ["4310:4310"]
    volumes: ["wakeoncue-data:/data"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: .
    command: ["pnpm", "start:worker"]
    env_file: [.env]
    environment:
      WAKEONCUE_DATABASE_PATH: /data/wakeoncue.sqlite
    volumes: ["wakeoncue-data:/data"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  wakeoncue-data:
