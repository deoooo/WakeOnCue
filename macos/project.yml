name: WakeOnCue
options:
  bundleIdPrefix: com.deoooo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Signing lives in Signing.xcconfig, which includes the untracked Local.xcconfig written by
# scripts/setup-signing.sh. A stable identity keeps macOS privacy permissions across rebuilds.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    # Apple silicon only: SpeechAnalyzer and Apple Intelligence need it.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

# Qwen3-ASR 1.7B runs on the GPU through MLX. Pinned to a reviewed commit (v0.1.8); mlx-swift is
# listed too so the app can build MLXArray itself, in the range mlx-audio-swift asks for.
packages:
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    revision: df2a2546705f50ca267037702a34cd63aa6e35a6
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.33.0

targets:
  WakeOnCue:
    type: application
    platform: macOS
    sources:
      - path: WakeOnCue
    dependencies:
      - package: MLXAudio
        product: MLXAudioSTT
      - package: MLX
        product: MLX
      # The command-line tool ships inside the app: WakeOnCue.app/Contents/Helpers/wakeoncue. Not in
      # Contents/MacOS, where it would replace "WakeOnCue" on a case-insensitive disk.
      - target: WakeOnCueCLI
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    preBuildScripts:
      - name: Check signing identity
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CODE_SIGN_IDENTITY" = "-" ]; then
            echo "warning: 正在用 ad-hoc 签名，每次重新编译后 macOS 都会再次询问麦克风等权限。运行 macos/scripts/setup-signing.sh 改用稳定的签名。"
          fi
    postBuildScripts:
      - name: Embed crash watchdog launch agent
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          cp "${SRCROOT}/Library/LaunchAgents/com.deoooo.WakeOnCue.crashwatch.plist" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents/"
          # Kept only so CrashRecovery can unregister the old KeepAlive watchdog.
          cp "${SRCROOT}/Library/LaunchAgents/com.deoooo.WakeOnCue.watchdog.plist" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deoooo.WakeOnCue.macos
        PRODUCT_NAME: WakeOnCue
        # The post-build copy puts the crash-watchdog plist under Contents/Library/LaunchAgents.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Process taps on other apps' audio and an all-day recorder; not sandboxed in phase 1.
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        # Icon PNGs come from ios/Design/make_icons.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: zh-Hans
        SWIFT_EMIT_LOC_STRINGS: NO
        OTHER_LDFLAGS: -lsqlite3
        SWIFT_OBJC_BRIDGING_HEADER: WakeOnCue/WakeOnCue-Bridging-Header.h
    info:
      path: WakeOnCue/Info.plist
      properties:
        CFBundleDisplayName: WakeOnCue
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresNativeExecution: true
        NSMicrophoneUsageDescription: WakeOnCue 会全天录下 Mac 麦克风的声音，转录和总结都只在这台 Mac 上进行。
        NSLocalNetworkUsageDescription: WakeOnCue 通过本地网络接收已配对 iPhone 转来的手表和 iPhone 录音，数据用配对时的密钥加密，不经过互联网。
        NSBonjourServices:
          - _wakeoncue._tcp
          - _wakeoncue-pair._tcp
        # The summary gateway may be on the local network over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSpeechRecognitionUsageDescription: WakeOnCue 用系统的语音识别在这台 Mac 上转录录音。
    entitlements:
      path: WakeOnCue/WakeOnCue.entitlements
      properties:
        com.apple.security.device.audio-input: true
        # The sherpa-onnx libraries are downloaded from its official releases (signed by their
        # publisher, checked against the published SHA-256) and loaded with dlopen.
        com.apple.security.cs.disable-library-validation: true

  # Named apart from the app: on a case-insensitive disk "wakeoncue" and "WakeOnCue" would share
  # build folders and module files.
  WakeOnCueCLI:
    type: tool
    platform: macOS
    sources:
      - path: WakeOnCueCLI
      # Reads the library through the app's own storage code.
      - path: WakeOnCue/Storage
      - path: WakeOnCue/App/TimeText.swift
      # Store records received segments with the sync protocol's types.
      - path: WakeOnCue/Sync/SyncProtocol.swift
      # `wakeoncue export` writes the same files as the app's 导出.
      - path: WakeOnCue/Export/Export.swift
      - path: WakeOnCue/Export/ExportSource+Store.swift
    settings:
      base:
        PRODUCT_NAME: wakeoncue
        PRODUCT_MODULE_NAME: WakeOnCueCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.deoooo.WakeOnCue.macos.cli
        ENABLE_HARDENED_RUNTIME: true
        OTHER_LDFLAGS: -lsqlite3
        SKIP_INSTALL: YES

  # Logic tests without a host app, so running them never starts the recorder or touches the real
  # library. They compile the code they cover directly.
  WakeOnCueTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WakeOnCueTests
      - path: WakeOnCue/Storage
      - path: WakeOnCue/Export/Export.swift
      - path: WakeOnCue/App/TimeText.swift
      - path: WakeOnCue/Sync/SyncProtocol.swift
      - path: WakeOnCue/UI/Main/DayData.swift
      - path: WakeOnCue/Playback/Player.swift
      - path: WakeOnCue/Capture/ChannelPipeline.swift
      - path: WakeOnCue/Transcription/TranscriptFilter.swift
      - path: WakeOnCue/Transcription/Vocabulary.swift
      - path: WakeOnCue/Transcription/SentenceGroups.swift
      - path: WakeOnCue/Transcription/SentenceSplitter.swift
      - path: WakeOnCue/Transcription/LiveLatency.swift
      - path: WakeOnCue/Transcription/SpeakerClustering.swift
      - path: WakeOnCue/Transcription/VoiceReference.swift
      - path: WakeOnCue/Intelligence/SummaryMaterial.swift
      - path: WakeOnCue/Intelligence/SummaryEngine.swift
      - path: WakeOnCue/Intelligence/GatewayEngine.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deoooo.WakeOnCue.macos.tests
        GENERATE_INFOPLIST_FILE: true
        OTHER_LDFLAGS: -lsqlite3

schemes:
  WakeOnCue:
    build:
      targets:
        WakeOnCue: all
        WakeOnCueTests: [test]
    run:
      config: Debug
    test:
      targets:
        - WakeOnCueTests
